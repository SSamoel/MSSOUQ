<div class="login">
  <div class="row ">
    <div class="col-md-6 img-side ">
      <img class="loginImage" src="/assets/images/register.png">
    </div>
    <div class=" col-md-6 h-100">
      <mat-card>
        <mat-card-title class="text-center"><img class="logoImage"
            src="/assets/images/logo.png" /></mat-card-title>
        <mat-card-content>
          <form action="" [formGroup]="loginForm" (ngSubmit)="login()">
            <div class="col-12">
              <mat-form-field class="w-100 mt-2">
                <mat-label>{{'Email' | translate}}</mat-label>
                <input matInput type="email" formControlName="email">
                <mat-icon matPrefix class="me-2"> email </mat-icon>
              </mat-form-field>
            </div>
            <div class="col-12">
              <mat-form-field class="w-100 my-2">
                <mat-label>{{'Password' | translate}}</mat-label>
                <input matInput type="password" formControlName="password">
                <mat-icon matPrefix class="me-2"> password </mat-icon>
              </mat-form-field>
            </div>
            <div class="col-12 d-flex justify-content-between">
              <mat-checkbox class="mt-3">{{'Remember'| translate}}</mat-checkbox>
              <a  class="mt-3">{{'ForgotPassword'|translate}}</a>
            </div>
            <div class="col-12 botton">
              <button mat-button class="reg" type="submit"
                [disabled]="loginForm.invalid">{{'login'|translate}}
              </button>
            </div>
            <div class="col-12 mt-4">
              <span class="w-100">
                {{'Register'|translate}}
                <a  routerLink="/auth/register">{{'signup'|translate}}</a>
              </span>
            </div>
          </form>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
