<div class="contact-us">
    <div class="row">
        <div class="col-lg-12 ">
        <mat-card>
            <mat-card-title class="text-center">{{'contactUs'|translate}}</mat-card-title>
            <mat-card-content>
                <form action="" [formGroup]="contactUsForm" (ngSubmit)="send()">
                    <div class="col-12">
                        <mat-form-field  appearance="fill" class="w-100">
                            <mat-label>{{'name'|translate}}</mat-label>
                            <input matInput formControlName="name">
                        </mat-form-field >
                    </div>
                    <div class="col-12">
                        <mat-form-field appearance="fill" class="w-100">
                            <mat-label>{{'mail'|translate}}</mat-label>
                            <input matInput formControlName="mail">
                        </mat-form-field> 
                    </div>
                    <div class="col-12">
                        <mat-form-field appearance="fill" class="w-100">
                            <mat-label>{{'message'|translate}}</mat-label>
                            <textarea matInput formControlName="message"></textarea>
                        </mat-form-field> 
                    </div>
                    <div class="col-12 botton">
                        <button mat-button  type="submit">{{'submit'|translate}}<mat-icon>arrow_right_alt</mat-icon></button>
                    </div>
                </form>
            </mat-card-content>
        </mat-card>
    </div>
    </div>
</div>
